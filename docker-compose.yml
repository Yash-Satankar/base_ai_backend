version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: base_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-base_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: base_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: base_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./base_ai_backend
      dockerfile: Dockerfile
    container_name: base_ai_backend
    environment:
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-base_ai}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - JWT_SECRET=${JWT_SECRET}
      - MASTER_API_KEY=${MASTER_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./base_ai_chat
      dockerfile: Dockerfile
    container_name: base_ai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── Ephemeral MySQL 8 used ONLY by the execution-validation gate ──
  # Not part of the default stack — start it explicitly:
  #   docker compose --profile validation up -d mysql-test
  # then point the backend at it:
  #   MYSQL_EXEC_VALIDATION_ENABLED=True
  #   MYSQL_EXEC_VALIDATION_DSN=mysql://root:test@localhost:3310/
  # Data lives in tmpfs — every restart is a clean server.
  mysql-test:
    image: mysql:8.0
    container_name: base_ai_mysql_test
    profiles: ["validation"]
    command: >
      --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,ERROR_FOR_DIVISION_BY_ZERO
      --skip-mysqlx
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      - "3310:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ptest --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
